[project]
name = "movie-maker"
version = "0.1.0"
description = "A modern, independent reimplementation of the Windows Movie Maker experience"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2,<3",
    "platformdirs>=4,<5",
    "pydantic>=2.12,<3",
    "PySide6>=6.11.2,<6.12",
]

[project.scripts]
movie-maker = "movie_maker.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-qt>=4.5",
    "pytest-timeout>=2",
    "ruff>=0.11",
]

[tool.uv]
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
files = ["src"]
python_version = "3.13"
strict = true
